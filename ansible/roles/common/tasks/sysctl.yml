---
# roles/common/tasks/sysctl.yml
# Applies kernel hardening parameters.
# All settings are defined in common_sysctl_settings in vars/main.yml
# with a comment explaining what each one does and why.

- name: Apply sysctl hardening parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-cs3-hardening.conf
    # sysctl_file = write to a dedicated file
    # Keeps our changes isolated from the system defaults
    # Easy to identify and remove if needed
    reload: true
    # reload = apply immediately without rebooting
    # Changes take effect on the running kernel right now
  loop: "{{ common_sysctl_settings | dict2items }}"
  # dict2items converts the dictionary in vars/main.yml to a list
  # of {key: ..., value: ...} pairs that the loop can iterate over
  tags: [common, common_sysctl]
