---
# roles/common/tasks/fail2ban/main.yml
# Dispatches fail2ban configuration to the correct OS-specific file.
# Common role configures SSH protection only.
# Service-specific jails (Asterisk SIP, etc.) are added by each
# service role into /etc/fail2ban/jail.d/ — they never conflict.

- name: Configure fail2ban (Debian family)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure fail2ban (RedHat family)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Warn if OS family is not supported
  ansible.builtin.debug:
    msg: >
      WARNING: {{ inventory_hostname }} runs
      {{ ansible_facts['distribution'] }} which is not a supported
      OS family for fail2ban configuration. Skipping.
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']
