---
# roles/common/tasks/packages/main.yml
# Dispatches package installation to the correct OS-specific file.

- name: Install and remove packages (Debian family)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install and remove packages (RedHat family)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Warn if OS family is not supported
  ansible.builtin.debug:
    msg: >
      WARNING: {{ inventory_hostname }} runs
      {{ ansible_facts['distribution'] }} which is not a supported
      OS family for package management. Skipping.
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']
