---
# roles/common/tasks/ipv6.yml
# Disables IPv6 system-wide.
# Proxmox does not need IPv6 in this environment and disabling it
# reduces attack surface and eliminates IPv6-related firewall complexity.
# UFW rules are simpler when you only need to think about IPv4.

- name: Disable IPv6 via sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-disable-ipv6.conf
    # sysctl_file = write to a dedicated file instead of the main sysctl.conf
    # Keeps our changes isolated and easy to identify
    reload: true
    # reload = apply the change immediately without rebooting
  loop:
    - { key: "net.ipv6.conf.all.disable_ipv6",     value: "1" }
    - { key: "net.ipv6.conf.default.disable_ipv6",  value: "1" }
    - { key: "net.ipv6.conf.lo.disable_ipv6",       value: "1" }
    # all       = all existing network interfaces
    # default   = any new interfaces created in the future (VMs, bridges)
    # lo        = the loopback interface
    # Setting all three ensures no interface ever gets an IPv6 address
  tags: [common, common_ipv6]

- name: Disable IPv6 in GRUB kernel parameters
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?!.*ipv6\.disable=1)[^"]*)"$'
    line: '\1 ipv6.disable=1"'
    backrefs: true
    # backrefs: true — use capture groups from regexp in the line value.
    # How this works:
    #   regexp captures everything in GRUB_CMDLINE_LINUX="..." EXCEPT
    #   the closing quote, but only when ipv6.disable=1 is NOT already
    #   present (the negative lookahead (?!.*ipv6\.disable=1) ensures
    #   this is idempotent — if the parameter is already there the
    #   regexp will not match and the line is left untouched).
    #   line then appends " ipv6.disable=1" before the closing quote.
    # Result: existing parameters like serial console settings are
    # preserved and ipv6.disable=1 is appended after them.
    # Without backrefs the old task replaced the entire line value,
    # wiping out any existing kernel parameters.
    backup: true
  notify: Update GRUB
  tags: [common, common_ipv6]
