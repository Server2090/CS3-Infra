---
# roles/common/tasks/updates/main.yml
# Dispatches automatic security updates to the correct OS-specific file.
# Debian  → unattended-upgrades
# RedHat  → dnf-automatic

- name: Configure automatic updates (Debian family)
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Configure automatic updates (RedHat family)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Warn if OS family is not supported
  ansible.builtin.debug:
    msg: >
      WARNING: {{ inventory_hostname }} runs
      {{ ansible_facts['distribution'] }} which is not a supported
      OS family for automatic updates. Skipping.
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']
