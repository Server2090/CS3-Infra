---
# roles/common/tasks/ntp/debian.yml
# Installs and configures chrony as the NTP client on Debian hosts.

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
  # chrony not actually installed in check mode — same pattern as
  # fail2ban and UFW. Ignored in dry runs only.
