---
# ansible/roles/asterisk/vars/main.yml
# All configurable values for the Asterisk role.
# Tasks and templates reference these variables — nothing is
# hardcoded in task files or templates.
#
# NOTE: packages already installed by the common role (curl, wget,
# fail2ban, ufw) are intentionally NOT listed here. Common always
# runs before this role — those packages are guaranteed present.

# ── Asterisk build ────────────────────────────────────────────────
asterisk_version: "22-current"
# "22-current" always resolves to the latest Asterisk 22 LTS release.
# Download URL:
#   https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22-current.tar.gz
# Supported until October 2028, security fixes until 2029.

asterisk_source_dir: "/usr/src/asterisk"
# Where the source tarball is extracted.
# Kept after compilation so re-runs detect it and skip the download.

asterisk_user: "asterisk"
asterisk_group: "asterisk"
# Dedicated non-root service account.
# No login shell, no password — service only.

asterisk_config_dir: "/etc/asterisk"
asterisk_log_dir: "/var/log/asterisk"
asterisk_run_dir: "/var/run/asterisk"
asterisk_spool_dir: "/var/spool/asterisk"
# Standard Asterisk runtime directories.
# All owned by asterisk:asterisk so the service never needs root.

# ── Build dependencies ────────────────────────────────────────────
# Packages needed to compile Asterisk 22 from source on Debian 13.
# curl and wget are intentionally omitted — common installs them.
asterisk_build_deps:
  - build-essential     # gcc, g++, make — C compiler toolchain
  - libssl-dev          # OpenSSL headers — SIP TLS and SRTP support
  - libncurses5-dev     # Terminal UI — Asterisk CLI
  - libnewt-dev         # Used by Asterisk menuselect build tool
  - libxml2-dev         # XML parsing — Asterisk config parser
  - libsqlite3-dev      # SQLite — Asterisk internal database (AstDB)
  - uuid-dev            # UUID generation — SIP call IDs
  - libjansson-dev      # JSON — required for ARI REST interface
  - libedit-dev         # Command line editing — Asterisk CLI
  - libsrtp2-dev        # SRTP — encrypted media support
  - libopus-dev         # Opus codec — high quality, low bandwidth
  - libspeexdsp-dev     # Echo cancellation and noise reduction
  - pkg-config          # Library path helper for ./configure
  - autoconf            # Autotools — used by ./configure
  - automake            # Autotools — used by ./configure
  - libtool-bin         # Autotools — used by ./configure
  - subversion          # SVN — used by get_mp3_source.sh script
  - unixodbc-dev        # ODBC — needed for some Asterisk modules
  - git                 # Required by some Asterisk contrib scripts

# ── Runtime dependencies ──────────────────────────────────────────
# Packages needed at runtime that common does not install.
# fail2ban and ufw are intentionally omitted — common installs them.
asterisk_runtime_deps:
  - qemu-guest-agent
  # Allows Proxmox to report the VM IP, perform graceful shutdown,
  # and take consistent snapshots. Not installed by common because
  # common runs on Proxmox nodes too — the hypervisor itself does
  # not need the guest agent. VMs do.

# ── SIP extensions ────────────────────────────────────────────────
# One entry per analog phone port across both ATAs.
# HT802 has 2 FXS ports each = 4 extensions total.
# Scheme: 1xx = HT802 v1,  2xx = HT802 v2
sip_extensions:
  - id: "101"
    label: "HT802-v1-port1"
    ata_host: "192.168.71.10"
    secret_var: "sip_secret_101"

  - id: "102"
    label: "HT802-v1-port2"
    ata_host: "192.168.71.10"
    secret_var: "sip_secret_102"

  - id: "201"
    label: "HT802-v2-port1"
    ata_host: "192.168.10.169"
    secret_var: "sip_secret_201"

  - id: "202"
    label: "HT802-v2-port2"
    ata_host: "192.168.10.169"
    secret_var: "sip_secret_202"

# ── PJSIP transport ───────────────────────────────────────────────
pjsip_transport: "transport-udp"
pjsip_bind_ip: "0.0.0.0"
# Listen on all interfaces. UFW restricts who can reach port 5060 —
# the firewall is the security boundary, not the bind address.

pjsip_local_nets:
  - "192.168.80.0/24"   # Management network — Asterisk server
  - "192.168.71.0/24"   # HT802 v1 network
  - "192.168.10.0/24"   # HT802 v2 network
# Tells PJSIP these subnets are directly reachable — do not
# rewrite SIP Contact headers thinking they are behind NAT.

# ── Dialplan ──────────────────────────────────────────────────────
dialplan_context: "internal"
# All extensions placed in [internal] context.
# Phones can only reach other extensions in this context —
# cannot accidentally reach outside lines or system contexts.

# ── Music on hold ─────────────────────────────────────────────────
moh_class: "default"
# Uses Asterisk's built-in sample MOH files.
# To change: drop .wav/.mp3 files in /var/lib/asterisk/moh/
# and run: asterisk -rx "moh reload"
