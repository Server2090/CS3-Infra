---
# ansible/roles/asterisk/tasks/main.yml
# Role entrypoint — imports all task files in order.
# Each file has one job. Read the filename to know what it does.
#
# Prerequisites: the common role must run before this role.
# Common provides: ufw, fail2ban, curl, wget, cs3admin user, SSH hardening.
# This role only adds what is Asterisk-specific on top of that base.
#
# Run one section only:
#   ansible-playbook site.yml --limit voip --tags asterisk_packages
#   ansible-playbook site.yml --limit voip --tags asterisk_user
#   ansible-playbook site.yml --limit voip --tags asterisk_dirs
#   ansible-playbook site.yml --limit voip --tags asterisk_compile
#   ansible-playbook site.yml --limit voip --tags asterisk_service
#   ansible-playbook site.yml --limit voip --tags asterisk_firewall
#   ansible-playbook site.yml --limit voip --tags asterisk_fail2ban

- name: Install packages
  ansible.builtin.import_tasks: packages.yml
  tags: asterisk_packages

- name: Create asterisk system user and group
  ansible.builtin.import_tasks: user.yml
  tags: asterisk_user

- name: Create Asterisk runtime directories
  ansible.builtin.import_tasks: directories.yml
  tags: asterisk_dirs

- name: Compile and install Asterisk from source
  ansible.builtin.import_tasks: compile.yml
  tags: asterisk_compile

- name: Install and enable Asterisk systemd service
  ansible.builtin.import_tasks: service.yml
  tags: asterisk_service

- name: Configure Asterisk PJSIP, dialplan, and MOH
  ansible.builtin.import_tasks: configure.yml
  tags: asterisk_configure

- name: Configure firewall rules for SIP and RTP
  ansible.builtin.import_tasks: firewall.yml
  tags: asterisk_firewall

- name: Configure fail2ban jail for Asterisk SIP
  ansible.builtin.import_tasks: fail2ban.yml
  tags: asterisk_fail2ban
