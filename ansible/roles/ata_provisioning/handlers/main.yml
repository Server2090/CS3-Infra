---
# ansible/roles/ata_provisioning/handlers/main.yml

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  listen: "Restart nginx"

- name: Reload UFW
  community.general.ufw:
    state: reloaded
  listen: "Reload UFW"
  # UFW rules added by nginx.yml need a reload to become active.
  # This handler is notified when new HTTP provisioning rules are added.
