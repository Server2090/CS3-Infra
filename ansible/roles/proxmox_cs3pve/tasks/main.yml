---
# roles/proxmox_cs3pve/tasks/main.yml
# Node-specific tasks for pve (Dell PowerEdge R440)
# Runs after the shared proxmox role.
# Handles hardware-specific setup that only applies to this machine.
#
# Order:
#   1. zfs_pool   — create vmdata pool on first run only
#   2. zfs_tune   — apply ARC cap and dataset settings
#   3. storage    — register vmdata pool in Proxmox web UI

# ── ZFS VM pool ───────────────────────────────────────────────────

- name: Check if vmdata pool already exists
  ansible.builtin.command:
    cmd: zpool list vmdata
  register: vmdata_check
  failed_when: false
  changed_when: false
  # failed_when: false — zpool list returns exit code 1 if pool does not exist
  # Without this line Ansible would treat that as a task failure and stop
  # changed_when: false — checking never counts as a change in Ansible output
  tags: [proxmox_cs3pve, zfs]

- name: Create vmdata ZFS stripe pool
  ansible.builtin.command:
    cmd: >
      zpool create -f
      -o ashift={{ proxmox_vm_pool_ashift }}
      -O compression={{ proxmox_vm_pool_compression }}
      -O atime=off
      -O xattr=sa
      {{ proxmox_vm_pool }}
      {{ proxmox_vm_drives | join(' ') }}
  when: vmdata_check.rc != 0
  # rc != 0 means the pool does not exist — safe to create
  # rc == 0 means the pool exists — this task is skipped entirely
  # This is the idempotency guard — pool can never be wiped by a rerun
  tags: [proxmox_cs3pve, zfs]

- name: Set ZFS ARC max size
  ansible.builtin.shell:
    cmd: >
      echo "options zfs zfs_arc_max={{ proxmox_arc_max_gb | int * 1024 * 1024 * 1024 }}"
      > /etc/modprobe.d/zfs.conf
  args:
    creates: /etc/modprobe.d/zfs.conf
  # creates: — only runs if this file does not exist yet
  # Converts proxmox_arc_max_gb (8) to bytes for the kernel parameter
  # 8 * 1024 * 1024 * 1024 = 8589934592 bytes = 8GB
  tags: [proxmox_cs3pve, zfs]

- name: Apply ARC limit immediately without rebooting
  ansible.builtin.shell:
    cmd: >
      echo {{ proxmox_arc_max_gb | int * 1024 * 1024 * 1024 }}
      > /sys/module/zfs/parameters/zfs_arc_max
  changed_when: false
  tags: [proxmox_cs3pve, zfs]

- name: Verify vmdata pool is healthy
  ansible.builtin.command:
    cmd: zpool status vmdata
  register: vmdata_status
  changed_when: false
  tags: [proxmox_cs3pve, zfs]

- name: Show vmdata pool status
  ansible.builtin.debug:
    msg: "{{ vmdata_status.stdout_lines }}"
  tags: [proxmox_cs3pve, zfs]

# ── Proxmox storage registration ──────────────────────────────────

- name: Check if vmdata storage is already registered in Proxmox
  ansible.builtin.command:
    cmd: pvesm status --storage vmdata
  register: pvesm_check
  failed_when: false
  changed_when: false
  # failed_when: false — pvesm status returns non-zero if storage not found
  # We use the return code to decide whether to register
  tags: [proxmox_cs3pve, storage]

- name: Register vmdata pool in Proxmox storage
  ansible.builtin.command:
    cmd: >
      pvesm add zfspool vmdata
      --pool vmdata
      --content images,rootdir
      --nodes pve
  when: pvesm_check.rc != 0
  # Only register if pvesm status returned non-zero (storage not found)
  # If storage already exists this task is skipped — fully idempotent
  tags: [proxmox_cs3pve, storage]
