---
# roles/proxmox/tasks/api_tokens.yml
# Creates the OpenTofu API token in Proxmox.
# The token is used by OpenTofu to authenticate against the
# Proxmox API when provisioning VMs.
#
# The token secret is generated by Proxmox and captured here.
# It is written to tofu/secrets.sops.yaml encrypted with your
# age key — never stored in plaintext anywhere.
#
# This task only creates the token if it does not already exist.
# If you need to rotate the token, delete it in the Proxmox web UI
# first, then rerun this task.

- name: Check if OpenTofu API token already exists
  ansible.builtin.command:
    cmd: pveum user token list {{ proxmox_api_token_user }} --output-format json
    # Lists all tokens for the opentofu@pve user in JSON format
  register: token_list
  changed_when: false
  failed_when: false
  tags: [proxmox, proxmox_api_tokens]

- name: Create OpenTofu API token
  ansible.builtin.command:
    cmd: >
      pveum user token add {{ proxmox_api_token_user }}
      {{ proxmox_api_token_name }}
      --privsep 0
      --output-format json
    # privsep 0 = disable privilege separation
    # The token inherits all privileges of the opentofu@pve user
    # --output-format json = capture the token secret in JSON
    # The secret is ONLY shown once at creation time
  register: token_create
  when: >
    proxmox_api_token_name not in
    (token_list.stdout | from_json | map(attribute='tokenid') | list
    | map('split', '!') | map('last') | list)
  # Only create if the token name is not already in the token list
  # from_json parses the JSON output of the list command
  # map extracts and splits the tokenid field to get just the name
  tags: [proxmox, proxmox_api_tokens]

- name: Display token secret — save this to KeePassXC and tofu/secrets.sops.yaml
  ansible.builtin.debug:
    msg:
      - "TOKEN ID:     {{ proxmox_api_token_user }}!{{ proxmox_api_token_name }}"
      - "TOKEN SECRET: {{ (token_create.stdout | from_json).value }}"
      - "Save the token secret to KeePassXC NOW — it will not be shown again"
      - "Then add it to tofu/secrets.sops.yaml encrypted with sops"
  when: token_create is changed
  # Only show when a new token was actually created
  # If the token already existed this task is skipped
  tags: [proxmox, proxmox_api_tokens]
