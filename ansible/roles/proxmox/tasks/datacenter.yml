---
# roles/proxmox/tasks/datacenter.yml
# Configures Proxmox datacenter-wide settings via pvesh API.
# We use pvesh instead of writing the file directly because
# /etc/pve is a FUSE filesystem managed by Proxmox cluster —
# direct writes can cause corruption or be overwritten.
#
# To see all valid options for your Proxmox version run:
#   pvesh get /cluster/options --help

- name: Configure datacenter keyboard layout
  ansible.builtin.command:
    cmd: pvesh set /cluster/options --keyboard en-us
  changed_when: false
  tags: [proxmox, proxmox_datacenter]

- name: Configure datacenter language
  ansible.builtin.command:
    cmd: pvesh set /cluster/options --language en
  changed_when: false
  tags: [proxmox, proxmox_datacenter]

- name: Configure datacenter max workers
  ansible.builtin.command:
    cmd: pvesh set /cluster/options --max_workers 4
  changed_when: false
  tags: [proxmox, proxmox_datacenter]
