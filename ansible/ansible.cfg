# ansible/ansible.cfg
# Ansible configuration for cs3-infra.
# Ansible reads this file automatically when you run commands
# from the ansible/ directory or any subdirectory of it.

[defaults]
# Where to find the inventory — hosts, groups, and variables
inventory = inventory/hosts.yml

# Always use python3 explicitly — never let Ansible guess
interpreter_python = /usr/bin/python3

# Default remote user for all connections
# Proxmox only has root after a fresh install
remote_user = root

# Where Ansible looks for roles
roles_path = roles/

# Disable host key checking during initial bootstrap
# The server is brand new — we have not verified its host key yet
# We will lock this down after first connection via known_hosts
host_key_checking = False

# Only one node — no reason to run in parallel
forks = 1

# Suppress cowsay output — keeps logs clean
nocows = 1

# Show task timing after each playbook run
# Useful for knowing which tasks are slow
callback_plugins   = profile_tasks
callbacks_enabled  = profile_tasks

[ssh_connection]
# Pipelining reduces the number of SSH connections per task
# Significantly speeds up playbook runs
# Requires requiretty to be disabled in sudoers — fine for root
pipelining = True

# SSH connection reuse settings
# ControlMaster=auto — reuse existing SSH connections
# ControlPersist=60s — keep the master connection open 60s after last use
# This means the first task opens SSH, every subsequent task reuses it
# dramatically reducing connection overhead on long playbooks
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[community.sops]
# Decrypt SOPS secrets at inventory load time
# This means encrypted variables are available before any task runs
# Requires sops binary and age key at ~/.config/sops/age/keys.txt
stage = inventory
