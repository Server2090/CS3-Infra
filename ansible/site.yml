---
# ansible/site.yml
# Master playbook for cs3-infra.
#
# Run the full playbook:
#   ansible-playbook site.yml
#
# Run against a specific host or group only:
#   ansible-playbook site.yml --limit voip
#   ansible-playbook site.yml --limit asterisk
#
# Run against a specific tag only:
#   ansible-playbook site.yml -t common_ssh
#   ansible-playbook site.yml -t asterisk_pjsip
#
# Preview changes without applying them:
#   ansible-playbook site.yml --check --diff --limit voip
#
# Run with verbose output for debugging:
#   ansible-playbook site.yml -v --limit voip

# ── Step 1: Common baseline ────────────────────────────────────────
# Applies to every host — SSH hardening, firewall, NTP, packages.
# Must run before any service role because it installs dependencies
# and creates the operator accounts other tasks rely on.
- name: Apply common configuration to Proxmox nodes
  hosts: proxmox
  gather_facts: true
  roles:
    - role: common

# ── Step 2: Proxmox shared config ─────────────────────────────────
# Applies Proxmox-specific config shared across all nodes.
# Repos, datacenter settings, network bridges, users, API tokens.
- name: Apply shared Proxmox configuration
  hosts: proxmox
  gather_facts: true
  roles:
    - role: proxmox

# ── Step 3: Node-specific config ──────────────────────────────────
# Applies hardware-specific config for the CS3 R440.
# ZFS pool creation, ARC tuning, storage registration.
- name: Apply cs3pve node-specific configuration
  hosts: pve
  gather_facts: true
  roles:
    - role: proxmox_cs3pve

# ── Step 4: VoIP server ───────────────────────────────────────────
# Applies common baseline then Asterisk to the voip group.
# Common runs first to set up SSH hardening, UFW, NTP, and
# the cs3admin user before Asterisk is installed on top.
# To run only the VoIP steps without touching Proxmox:
#   ansible-playbook site.yml --limit voip
- name: Apply common configuration to VoIP server
  hosts: voip
  gather_facts: true
  roles:
    - role: common

- name: Apply Asterisk VoIP configuration
  hosts: voip
  gather_facts: true
  roles:
    - role: asterisk

- name: Configure ATA provisioning server
  hosts: voip
  gather_facts: true
  roles:
    - role: ata_provisioning
    # Sets up nginx on the Asterisk VM to serve XML provisioning
    # files for both HT802 ATAs. ATAs fetch their SIP config
    # from http://192.168.80.10/ata/cfg<MAC>.xml on every reboot.
    # Role does not exist yet — created in Phase 3.
    # Running site.yml before Phase 3 is complete will error here.
    # To safely run only Proxmox steps in the meantime:
    #   ansible-playbook site.yml --limit proxmox
