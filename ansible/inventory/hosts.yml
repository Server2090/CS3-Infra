---
# ansible/inventory/hosts.yml
# Defines all hosts and groups for cs3-infra.
# This is the single source of truth for what servers exist
# and how Ansible connects to them.
#
# Variable precedence rule used here:
#   group_vars/<group>.yml  >  group_vars/all.yml  >  inline inventory vars
# This is why per-group connection settings (ansible_user, ssh key)
# live in group_vars/<group>.yml rather than inline here.

all:
  children:

    # ── Proxmox nodes ─────────────────────────────────────────────
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.80.30
          # ansible_host = the IP Ansible actually connects to.
          # pve = the inventory name, matches the Proxmox hostname.

    # ── VoIP server ───────────────────────────────────────────────
    # Group = voip (the service this group provides)
    # Host  = asterisk (the software running on the server)
    # Group-level connection vars live in group_vars/voip.yml.
    # That file overrides group_vars/all.yml for this group.
    voip:
      hosts:
        asterisk:
          ansible_host: 192.168.80.10
          # asterisk = host name, reflects the software running on it.
          # voip     = group name, reflects the service it provides.
          # Keeping them different avoids Ansible's warning about a
          # group and host sharing the same name.
          # Static IP set by cloud-init via OpenTofu.
          # If you ever change the VM IP, update it here and in
          # terraform.tfvars — two places, both clearly labelled.
