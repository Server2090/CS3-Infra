---
# ansible/inventory/hosts.yml
# Defines all hosts and groups for cs3-infra.
# This is the single source of truth for what servers exist
# and how Ansible connects to them.
#
# Variable precedence (most specific wins):
#   group_vars/all.yml < group_vars/<group>.yml < host_vars/<host>.yml
# voip group also inherits from debian group via children.

all:
  children:

    # ── Proxmox nodes ─────────────────────────────────────────────
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.80.30

    # ── Debian VMs ────────────────────────────────────────────────
    # Parent group for all Debian-based VMs.
    # group_vars/debian.yml applies to every host in this group
    # and all its children. Defines proxmox_type, package manager,
    # firewall tool — the common role reads these to dispatch to
    # the correct OS-specific task files.
    debian:
      children:

        # ── VoIP server ───────────────────────────────────────────
        # group_vars/voip.yml applies on top of debian.yml.
        # Connection settings (ansible_user, ssh key) live there.
        voip:
          hosts:
            asterisk:
              ansible_host: 192.168.80.10

    # ── Nodes not yet online ──────────────────────────────────────
    proxmox_pending:
      vars:
        ansible_connection: local
      hosts: {}
