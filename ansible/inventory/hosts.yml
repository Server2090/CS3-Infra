---
# ansible/inventory/hosts.yml
# Defines all hosts and groups for cs3-infra.
# This is the single source of truth for what servers exist
# and how Ansible connects to them.

all:
  children:

    # ── Proxmox nodes ─────────────────────────────────────────────
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.80.30
          # ansible_host = the IP Ansible actually connects to
          # pve = the inventory name, matches the hostname we set
          # during the Proxmox installer

    # ── Nodes not yet online ──────────────────────────────────────
    # Add future servers here before they exist so the inventory
    # structure is ready when the hardware arrives.
    # ansible_connection: local means Ansible will not try to SSH
    # to these hosts — tasks will show in output but not connect.
    proxmox_pending:
      vars:
        ansible_connection: local
      hosts: {}
      # Empty for now — add future nodes here when planning them
