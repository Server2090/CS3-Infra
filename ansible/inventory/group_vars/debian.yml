---
# ansible/inventory/group_vars/debian.yml
# Variables applied to every host in the debian group.
# These tell the common role which tools to use for this OS family.
# Mirrors the pattern from the homelab repo.

# ── Host classification ───────────────────────────────────────────
proxmox_type: qemu
# qemu  = QEMU VM running inside Proxmox (VoIP server, future VMs)
# lxc   = LXC container inside Proxmox (future use)
# Set to match how this host is provisioned in Proxmox.
# The common role uses this to skip tasks that do not apply
# to VMs (e.g. NTP is skipped on LXC — containers inherit
# host time and chrony cannot run in an unprivileged LXC).

# ── Package manager ───────────────────────────────────────────────
common_pkg_manager: apt
# apt = Debian/Ubuntu package manager.
# Referenced by common role tasks to decide between apt and dnf.

# ── Firewall tool ─────────────────────────────────────────────────
common_firewall: ufw
# ufw = Uncomplicated Firewall, standard Debian frontend for iptables.
# RedHat hosts use firewalld instead — set there in redhat.yml.

# ── Automatic updates tool ────────────────────────────────────────
common_auto_update: unattended-upgrades
# unattended-upgrades = Debian automatic security update tool.
# RedHat hosts use dnf-automatic instead.

# ── Python apt helper ─────────────────────────────────────────────
common_python_apt: python3-apt
# Required for Ansible's apt module to work correctly on Debian.
# Ansible checks for this package before running apt tasks.
